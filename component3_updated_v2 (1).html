<style>
  .mtr-wrap *{box-sizing:border-box;}

  .mtr-chip{font-size:13px; padding:6px 13px; border-radius:22px; border:0.5px solid var(--border); background:var(--surface-2); color:var(--text-secondary); cursor:pointer; transition:border-color .15s, background .15s; user-select:none;}

  .mtr-chip .n{font-variant-numeric:tabular-nums; opacity:.55; margin-right:5px;}

  .mtr-card{position:relative; overflow:hidden; background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1.1rem 1.2rem; cursor:pointer; transition:border-color .15s; display:flex; flex-direction:column;}

  .mtr-card.open{border-color:var(--border-strong); grid-column:1 / -1;}
  .mtr-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--acc, transparent);}
  .mtr-card{padding-left:calc(1.2rem + 3px);}
  .mtr-fam{font-size:12px; color:var(--text-secondary); margin-bottom:2px;}
  .mtr-name{font-size:18px; font-weight:500; line-height:1.25; margin-bottom:10px;}
  .mtr-promise{font-size:14px; line-height:1.5; color:var(--text-primary); margin-bottom:13px; flex:1;}
  .mtr-tags{display:flex; flex-wrap:wrap; gap:5px;}
  .mtr-tag{font-size:12px; padding:3px 9px; border-radius:20px; background:var(--surface-1); color:var(--text-secondary);}
  .mtr-badge{font-size:11px; padding:3px 9px; border-radius:20px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;}
  .mtr-badge.pv{background:var(--bg-success); color:var(--text-success);}
  .mtr-badge.np{background:var(--surface-1); color:var(--text-muted);}
  .mtr-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .mtr-detail{margin-top:14px; padding-top:14px; border-top:0.5px solid var(--border); display:none;}
  .mtr-card.open .mtr-detail{display:block;}
  .mtr-specs{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:9px; margin-bottom:14px;}
  .mtr-spec{background:var(--surface-1); border-radius:var(--radius); padding:9px 11px;}
  .mtr-spec .k{font-size:11px; color:var(--text-secondary); margin-bottom:3px; display:flex; align-items:center; gap:5px;}
  .mtr-spec .v{font-size:13px; font-weight:500; line-height:1.3;}
  .mtr-props{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .mtr-prop{font-size:12px; padding:4px 10px; border-radius:var(--radius); background:var(--surface-1); color:var(--text-secondary);}
  .mtr-prop b{font-weight:500; color:var(--text-primary);}
  .mtr-rows{margin-bottom:14px;}
  .mtr-row{display:flex; gap:8px; font-size:13px; line-height:1.5; padding:4px 0;}
  .mtr-row .rk{color:var(--text-secondary); min-width:82px; flex-shrink:0;}
  .mtr-row .rv{color:var(--text-primary);}
  .mtr-sub{font-size:13px; font-weight:500; margin-bottom:6px;}
  .mtr-can{font-size:13px; line-height:1.6; color:var(--text-secondary); margin-bottom:14px;}
  .mtr-risk{font-size:13px; font-weight:500; color:var(--text-danger); margin-bottom:5px; display:flex; align-items:center; gap:5px;}
  .mtr-risktxt{font-size:13px; line-height:1.55; color:var(--text-secondary); margin-bottom:12px;}
  .mtr-src{font-size:12px; color:var(--text-secondary); display:inline-flex; align-items:center; gap:5px; text-decoration:none;}
  .mtr-src:hover{color:var(--text-primary);}
  .mtr-count{font-size:12px; color:var(--text-muted); margin-bottom:1rem;}
  .mtr-empty{font-size:14px; color:var(--text-secondary); padding:2rem 0; text-align:center;}
</style>

(function(){
  const capOrder = Object.keys(MTR.caps).sort();
  let active = null;
  const filtersEl=document.getElementById('mtrFilters');
  const gridEl=document.getElementById('mtrGrid');
  const countEl=document.getElementById('mtrCount');
  const capCount=num=>MTR.materials.filter(m=>m.caps.some(c=>c.num===num)).length;
  const allChip=document.createElement('div');
  allChip.className='mtr-chip on'; allChip.textContent='Все';
  allChip.onclick=()=>{active=null;render();};
  filtersEl.appendChild(allChip);
  capOrder.forEach(num=>{
    const c=document.createElement('div');
    c.className='mtr-chip';
    c.innerHTML='<span class="n">'+num+'</span>'+MTR.caps[num]+' <span class="n" style="margin-left:4px;margin-right:0;">'+capCount(num)+'</span>';
    c.onclick=()=>{active=(active===num?null:num);render();};
    c.dataset.num=num;
    filtersEl.appendChild(c);
  });
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  function spec(icon,k,v){ return v?('<div class="mtr-spec"><div class="k"><i class="ti '+icon+'" style="font-size:14px" aria-hidden="true"></i>'+k+'</div><div class="v">'+esc(v)+'</div></div>'):''; }
  function prop(k,v){ return v?('<span class="mtr-prop">'+k+' <b>'+esc(v)+'</b></span>'):''; }
  function row(k,v){ return v?('<div class="mtr-row"><span class="rk">'+k+'</span><span class="rv">'+esc(v)+'</span></div>'):''; }
  function card(m){
    const el=document.createElement('div'); el.className='mtr-card';
    const acc = FAM_ACCENT[m.family] || 'transparent';
    if(acc!=='transparent'){ el.style.setProperty('--acc', acc); el.style.background='linear-gradient(90deg,'+hexToRgba(acc,0.05)+' 0%, var(--surface-2) 55%)'; }
    const shown=m.caps;
    const badge=m.proven
      ? '<span class="mtr-badge pv"><i class="ti ti-circle-check" style="font-size:13px" aria-hidden="true"></i>доказано</span>'
      : '<span class="mtr-badge np">в разработке</span>';
    const tags=shown.map(c=>'<span class="mtr-tag">'+c.num+' '+esc(c.label)+'</span>').join('');
    const canList=m.can.length?m.can.map(esc).join(' · '):'';
    const propsLine=prop('Пластичность',m.plast)+prop('Прочность',m.proch);
    el.innerHTML=
      '<div class="mtr-head"><div><div class="mtr-fam" style="color:'+acc+'">'+esc(m.family)+'</div><div class="mtr-name">'+esc(m.name)+'</div></div>'+badge+'</div>'
      +'<div class="mtr-promise">'+esc(m.promise||canList)+'</div>'
      +'<div class="mtr-tags">'+tags+'</div>'
      +'<div class="mtr-detail">'
        +'<div class="mtr-specs">'
          +spec('ti-ruler-2','Формат',m.format)
          +spec('ti-weight','Вес',m.weight)
          +spec('ti-map-pin','Применение',m.zone)
          +spec('ti-flame','Пожарный класс',m.fire)
          +spec('ti-sun','UV-стойкость',m.uv)
          +(m.extraSpecs||[]).map(x=>spec(x.icon||'ti-info-circle',x.k,x.v)).join('')
        +'</div>'
        +(propsLine?'<div class="mtr-props">'+propsLine+'</div>':'')
        +'<div class="mtr-rows">'
          +row('Основа',m.base)
          +row('Обработка',m.obr)
          +row('Отделка',m.fin)
          +(m.extraRows||[]).map(x=>row(x.k,x.v)).join('')
        +'</div>'
        +(canList?'<div class="mtr-sub">Что может</div><div class="mtr-can">'+canList+'</div>':'')
        +(m.risks?'<div class="mtr-risk"><i class="ti ti-alert-triangle" style="font-size:14px" aria-hidden="true"></i>Риски и ограничения</div><div class="mtr-risktxt">'+esc(m.risks)+'</div>':'')
        +(m.src?'<a class="mtr-src" href="'+esc(m.src)+'" target="_blank" rel="noopener"><i class="ti ti-external-link" style="font-size:14px" aria-hidden="true"></i>источник характеристик</a>':'')
      +'</div>';
    el.onclick=e=>{ if(e.target.closest('.mtr-tag')||e.target.closest('a'))return; el.classList.toggle('open'); };
    return el;
  }
  function plural(n){const a=n%10,b=n%100; if(a===1&&b!==11)return''; if(a>=2&&a<=4&&(b<10||b>=20))return'а'; return'ов';}
  function render(){
    Array.from(filtersEl.children).forEach(ch=>{
      if(ch===allChip) ch.classList.toggle('on',active===null);
      else ch.classList.toggle('on',ch.dataset.num===active);
    });
    const list=active?MTR.materials.filter(m=>m.caps.some(c=>c.num===active)):MTR.materials;
    countEl.textContent=list.length+' материал'+plural(list.length)+(active?' · возможность «'+active+' '+MTR.caps[active]+'»':' · '+capOrder.length+' возможностей');
    gridEl.innerHTML='';
    if(!list.length){gridEl.innerHTML='<div class="mtr-empty">Нет материалов под этот фильтр.</div>';return;}
    list.forEach(m=>gridEl.appendChild(card(m)));
  }
  render();
})();
</script>
</div></body></html>
